[build]
  command = "yarn build"
  publish = "build"

# Serve raw markdown companion files with the correct MIME type so AI
# crawlers and the Ask-AI button's deep links get plain text rather than
# HTML or a download prompt.
[[headers]]
  for = "/*.md"
  [headers.values]
    Content-Type = "text/markdown; charset=utf-8"
    Cache-Control = "public, max-age=300, must-revalidate"
    X-Robots-Tag = "index, follow"

# Same treatment for nested .md files (e.g. /docs/intro.md, /ai/.../foo.md).
[[headers]]
  for = "/**/*.md"
  [headers.values]
    Content-Type = "text/markdown; charset=utf-8"
    Cache-Control = "public, max-age=300, must-revalidate"
    X-Robots-Tag = "index, follow"

# llms.txt + llms-full.txt: plain text, edge-cached, robot-friendly.
[[headers]]
  for = "/llms.txt"
  [headers.values]
    Content-Type = "text/plain; charset=utf-8"
    Cache-Control = "public, max-age=300, must-revalidate"
    X-Robots-Tag = "index, follow"

[[headers]]
  for = "/llms-full.txt"
  [headers.values]
    Content-Type = "text/plain; charset=utf-8"
    Cache-Control = "public, max-age=300, must-revalidate"
    X-Robots-Tag = "index, follow"

# Query library is a separate site (query-library.stackql.io repo) proxied
# under the canonical path. 200 = proxy rewrite, URL stays on stackql.io.
# Response headers (content types, CORS, cache) are set by the origin site.
# CONTRACT: the `from` prefix here must equal `baseUrl` in the
# query-library.stackql.io repo's docusaurus.config.js (and the `to` strips
# it, so that origin serves at its root - see the comments in that repo's
# docusaurus.config.js and netlify.toml). These values must agree forever.
[[redirects]]
  from = "/docs/query-library/*"
  to = "https://query-library.stackql.io/:splat"
  status = 200
  force = true

# describe_resource was retired as an MCP tool (stackql PR #796); its page
# redirects to describe_method, the per-method source of column names.
[[redirects]]
  from = "/docs/mcp/describe_resource"
  to = "/docs/mcp/describe_method"
  status = 301

# Docs "Tutorials" were renamed "Quick Starts" (#288) so that "Tutorials"
# means the blog tutorials section. The splat covers the .md companions.
# /docs/azure was the mis-slugged Azure index before the rename.
[[redirects]]
  from = "/docs/tutorials"
  to = "/docs/quick-starts"
  status = 301

[[redirects]]
  from = "/docs/tutorials/*"
  to = "/docs/quick-starts/:splat"
  status = 301

[[redirects]]
  from = "/docs/azure"
  to = "/docs/quick-starts/azure"
  status = 301

# Former top-level meta-refresh stubs (src/pages/tutorials.js and
# cookbooks.js), now real 301s.
[[redirects]]
  from = "/tutorials"
  to = "/blog/tutorials"
  status = 301

[[redirects]]
  from = "/cookbooks"
  to = "/docs/quick-starts"
  status = 301

# Blog split (#288): the single blog at /blog/<slug> became three plugin
# instances at /blog/<section>/<slug>. Tag, pagination and archive routes
# of the old instance go to the landing page. The old feed URLs go to the
# product announcements feeds (each section now has its own feeds).
[[redirects]]
  from = "/blog/tags"
  to = "/blog"
  status = 301

[[redirects]]
  from = "/blog/tags/*"
  to = "/blog"
  status = 301

[[redirects]]
  from = "/blog/page/*"
  to = "/blog"
  status = 301

[[redirects]]
  from = "/blog/archive"
  to = "/blog"
  status = 301

[[redirects]]
  from = "/blog/rss.xml"
  to = "/blog/product/rss.xml"
  status = 301

[[redirects]]
  from = "/blog/atom.xml"
  to = "/blog/product/atom.xml"
  status = 301

[[redirects]]
  from = "/blog/feed.json"
  to = "/blog/product/feed.json"
  status = 301

